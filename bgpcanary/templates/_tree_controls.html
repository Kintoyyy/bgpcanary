<label title="Fit to screen shrinks the tree to fit your window's height (the text gets smaller)">Size <select data-rp="size"><option value="fit" selected>Fit to screen</option><option value="compact">Compact (75%)</option><option value="full">Full size</option></select></label>
<label title="The room between the tree's rows, on screen and in exports. Auto: Fit to screen packs the rows tighter when a tall tree would make the text too small; the others keep their spacing and scroll instead">Spacing <select data-rp="spacing"><option value="auto" selected>Auto</option><option value="20">Normal</option><option value="26">Roomy</option><option value="34">Spacious</option></select></label>
<span class="rp-only" title="Untick an upstream (or the exchanges) to hide its branch: its peers still count at your AS"><strong>Upstreams</strong> <span data-rp="only"></span></span>
<label title="Show the whole tree, or only its first levels: click a node (or its name) to open or close its branch, in either view">Open <select data-rp="open"><option value="all" selected>all levels</option><option value="1">1 level, click to open</option><option value="2">2 levels, click to open</option><option value="3">3 levels, click to open</option></select></label>
<label>Depth <select data-rp="depth"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
<label>Branches per node <select data-rp="top"><option>5</option><option selected>8</option><option>15</option><option>30</option></select></label>
<label title="Each upstream's own transits and peers that don't carry your routes through it: red when RIS sees one carrying you nowhere at all, faint blue when it reaches you another way (your own peer, say). 'Fold' puts the faint blue ones into one line per upstream">Upstream neighbours <select data-rp="nbrs"><option value="all" selected>all</option><option value="fold">fold the ones that reach you another way</option><option value="none">none</option></select></label>
